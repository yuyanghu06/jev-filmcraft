name: Build desktop previews
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build and test
        type: choice
        options: [all, windows-x64, macos-x64]
        default: all
      version:
        description: Preview version
        default: 0.1.0-preview.2
        required: true
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["windows-x64","macos-x64"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.platform == 'windows-x64' && 'windows-2025' || 'macos-15-intel' }}
    timeout-minutes: 90
    env:
      JEV_FILMCRAFT_VERSION: ${{ inputs.version }}
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/filmcraft
          key: desktop-${{ matrix.platform }}
          cache-on-failure: true
      - run: npm ci
      - run: npm run check
      - id: build
        run: npm run ${{ matrix.platform == 'windows-x64' && 'package:windows' || 'package:mac' }}
      - name: Test extracted app and bundled MCP
        run: npm run test:package
      - uses: actions/upload-artifact@v4
        # Preserve successful builds for debugging even when the package test fails.
        # Downloadable workflow artifacts are not published GitHub releases.
        if: always() && steps.build.outcome == 'success'
        with:
          name: jev-filmcraft-${{ matrix.platform }}
          path: |
            artifacts/releases/jev-filmcraft-*.zip
            artifacts/releases/jev-filmcraft-*.sha256
            artifacts/releases/jev-filmcraft-*.build.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.platform }}
          path: artifacts/releases/verification
          if-no-files-found: ignore
